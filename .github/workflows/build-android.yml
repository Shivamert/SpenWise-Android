name: Build SpendWise Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "SpendWise-Native-Android-Project.zip"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -o SpendWise-Native-Android-Project.zip -d extracted
          FILE=$(find extracted -name settings.gradle.kts -print -quit)
          if [ -z "$FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found in the ZIP."
            find extracted -maxdepth 4 -type f
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$FILE")" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          APK=$(find "$PROJECT_DIR" -type f -name '*debug.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "ERROR: No debug APK was generated."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SpendWise-debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
